<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SORTEADOR DE CASAS HOGWARTS - BY TEACHER LIZBETH GARAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',sans-serif}
body{min-height:100dvh;background:radial-gradient(circle at top,#2a1452 0%,#140824 55%,#080510 100%);color:#f5f3ff}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.moon{position:absolute;right:6%;top:5%;width:clamp(60px,11vw,96px);height:clamp(60px,11vw,96px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffffff,#e2d8ff 55%,#9b86d8);box-shadow:0 0 60px rgba(190,160,255,.85),0 0 140px rgba(120,80,220,.5);
  animation:moonGlow 6s ease-in-out infinite}
@keyframes moonGlow{0%,100%{box-shadow:0 0 50px rgba(190,160,255,.7),0 0 120px rgba(120,80,220,.4)}50%{box-shadow:0 0 80px rgba(210,185,255,1),0 0 170px rgba(140,100,240,.6)}}
.star{position:absolute;border-radius:50%;background:#fff;animation:twk ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.12;transform:scale(.85)}50%{opacity:1;transform:scale(1.2);box-shadow:0 0 10px rgba(255,255,255,.95)}}
.star.warm{background:#ffe9a8}
.star.cool{background:#b8e6ff}
.star.pink{background:#ffc7e8}
.shoot{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;box-shadow:0 0 10px #fff;left:64%;top:16%;
  animation:sh 7s linear infinite}
@keyframes sh{0%{transform:translate(0,0);opacity:0}5%{opacity:1}18%{transform:translate(-300px,190px);opacity:0}100%{opacity:0}}
.shoot.s2{animation-duration:11s;animation-delay:4.5s;left:22%;top:38%}
.shoot.s3{animation-duration:9s;animation-delay:7s;left:82%;top:52%}
.shoot.s4{animation-duration:13s;animation-delay:2s;left:48%;top:8%}
.neb{position:absolute;border-radius:50%;filter:blur(38px);opacity:.32;animation:drift linear infinite}
@keyframes drift{0%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-30px) scale(1.15)}66%{transform:translate(-40px,25px) scale(.92)}100%{transform:translate(0,0) scale(1)}}
.neb1{width:340px;height:340px;background:#7b2ff7;top:-90px;left:-80px;animation-duration:26s}
.neb2{width:300px;height:300px;background:#1f6bff;bottom:-100px;right:-70px;animation-duration:32s;animation-delay:-8s}
.neb3{width:260px;height:260px;background:#c026d3;top:42%;left:8%;animation-duration:38s;animation-delay:-16s}
.sparkbg{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8d0,#ffb62e);
  box-shadow:0 0 12px rgba(255,200,80,.9);animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translateY(0) translateX(0) scale(.6);opacity:0}
  12%{opacity:.9}50%{transform:translateY(-40vh) translateX(28px) scale(1.1)}
  100%{transform:translateY(-105vh) translateX(-18px) scale(.7);opacity:0}}
@media(prefers-reduced-motion:reduce){.moon,.star,.shoot,.neb,.sparkbg{animation:none!important}}
header,main,footer{position:relative;z-index:2}
header{text-align:center;padding:clamp(16px,4vw,32px) 16px 14px}
.logo{font-family:'Cinzel',serif;font-weight:900;letter-spacing:12px;text-transform:uppercase;font-size:clamp(28px,9vw,78px);color:#ffd24a;text-shadow:0 2px 0 #b45309,0 6px 0 #92400e,0 14px 40px rgba(255,210,74,.4)}
.sub{margin-top:6px;letter-spacing:10px;text-transform:uppercase;font-size:clamp(10px,1.6vw,14px);opacity:.8}
.tools{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:20px}
button{border:none;border-radius:999px;padding:12px 24px;font-weight:800;letter-spacing:6px;text-transform:uppercase;font-size:clamp(11px,1.2vw,14px);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn-big{background:linear-gradient(90deg,rgba(255,210,74,.95),rgba(255,160,50,.95));color:#1f1305;padding:18px 46px;font-size:clamp(14px,2.2vw,22px);letter-spacing:10px;box-shadow:0 16px 46px -10px rgba(255,190,60,.8);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.btn-wipe{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);color:rgba(248,247,255,.9);letter-spacing:5px}
main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,2vw,18px);padding:clamp(12px,3vw,26px);max-width:1600px;margin:0 auto}
@media(max-width:1180px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){main{grid-template-columns:1fr}}
.house{position:relative;border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,.18);background:radial-gradient(circle at top,rgba(255,255,255,.12),transparent 70%);box-shadow:0 60px 120px -80px var(--glow);display:flex;flex-direction:column}
.house:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at top,var(--glow),transparent 65%);opacity:.18}
.house>*{position:relative;z-index:1}
.crest-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:clamp(18px,4vw,28px) 16px 14px}
.crest-wrap{width:clamp(96px,14vw,132px);height:clamp(96px,14vw,132px);filter:drop-shadow(0 0 60px var(--glow))}
.crest-wrap img{width:100%;height:100%;object-fit:contain}
.house-name{font-family:'Cinzel',serif;font-weight:900;letter-spacing:12px;text-transform:uppercase;font-size:clamp(15px,2.4vw,21px)}
.counter{font-size:10px;letter-spacing:4px;text-transform:uppercase;opacity:.7}
.counter b{color:#ffd24a;opacity:1}
.panel{padding:0 clamp(16px,4vw,24px) clamp(18px,4vw,24px);display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:190px;border-radius:16px;border:1px solid rgba(255,255,255,.22);background:rgba(9,6,18,.7);color:#f8f7ff;padding:14px 16px;font-size:clamp(13px,1.5vw,15px);line-height:1.75;resize:vertical;white-space:pre-wrap}
textarea::placeholder{color:rgba(248,247,255,.42)}
.hint{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.45;text-align:center}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px;background:radial-gradient(circle,rgba(10,6,20,.985),rgba(5,3,12,.99));z-index:10}
.overlay.active{display:flex;animation:fade .3s ease}
.ov-title{font-family:'Cinzel',serif;font-weight:900;letter-spacing:10px;text-transform:uppercase;font-size:clamp(15px,3.2vw,28px);color:#ffd24a;opacity:.92}
.ov-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,2vw,26px);width:100%;max-width:1500px}
@media(max-width:1000px){.ov-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.ov-grid{grid-template-columns:1fr}}
.ov-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:clamp(14px,2.5vw,26px) 10px;border-radius:22px;border:1px solid var(--hc);background:radial-gradient(circle at top,var(--hg),rgba(9,6,18,.85) 70%);box-shadow:0 0 70px -20px var(--hc);animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.ov-card:nth-child(2){animation-delay:.07s}
.ov-card:nth-child(3){animation-delay:.14s}
.ov-card:nth-child(4){animation-delay:.21s}
@keyframes pop{from{opacity:0;transform:translateY(28px) scale(.9)}to{opacity:1;transform:none}}
.ov-crest{width:clamp(88px,13vw,148px);height:clamp(88px,13vw,148px);object-fit:contain;filter:drop-shadow(0 0 40px var(--hc))}
.ov-name{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(17px,3vw,34px);letter-spacing:3px;text-transform:uppercase;text-align:center;line-height:1.2;word-break:break-word}
.ov-house{letter-spacing:8px;text-transform:uppercase;font-size:clamp(9px,1.2vw,12px);opacity:.7;color:var(--hc)}
.ov-none{opacity:.45;letter-spacing:6px;text-transform:uppercase;font-size:12px}
.ov-round{letter-spacing:6px;text-transform:uppercase;font-size:clamp(10px,1.3vw,13px);opacity:.55}
.ov-tools{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:4px}
.ov-again{animation:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
footer{text-align:center;padding:18px;opacity:.55;letter-spacing:6px;text-transform:uppercase;font-size:10px}
</style>
</head>

<div id="sky"><div class="moon"></div></div>
<header>
  <div class="logo">SORTEADOR</div>
  <div class="sub">CASAS DE HOGWARTS · BY TEACHER LIZBETH GARAY</div>
  <div class="tools">
    <button class="btn-big" id="btnRound">SORTEAR</button>
    <button class="btn-wipe" id="btnReset">REINICIAR</button>
  </div>
</header>
<main id="houses"></main>
<div class="overlay" id="overlay">
  <div class="ov-title">LOS 4 JUGADORES DE LA RONDA</div>
  <div class="ov-grid" id="ovGrid"></div>
  <div class="ov-round" id="ovRound"></div>
  <div class="ov-tools">
    <button class="btn-big ov-again" id="btnAgain">SORTEAR OTRA RONDA</button>
    <button class="btn-wipe" id="btnClose">CERRAR</button>
  </div>
</div>
<footer>ESCRIBE LOS NOMBRES EN CADA CASA · UN JUGADOR POR CASA · GUARDADO EN ESTE NAVEGADOR</footer>

const KEY='hog-sort-v2';
const data=JSON.parse(localStorage.getItem(KEY)||'{}');
HOUSES.forEach(function(h){
  if(!data[h.id]||typeof data[h.id]!=='object') data[h.id]={text:'',pool:[],used:[],round:1};
  const d=data[h.id];
  if(typeof d.text!=='string') d.text='';
  if(!Array.isArray(d.pool)) d.pool=[];
  if(!Array.isArray(d.used)) d.used=[];
  if(!d.round) d.round=1;
});
const main=document.getElementById('houses');
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function parse(text){
  const out=[];
  text.split(/\n+/).forEach(function(l){
    const n=l.trim();
    if(n && out.indexOf(n)===-1) out.push(n);
  });
  return out;
}
function build(){
  main.innerHTML='';
  HOUSES.forEach(function(h){
    const d=data[h.id];
    const el=document.createElement('section');
    el.className='house';
    el.style.setProperty('--glow',h.glow);
    el.style.setProperty('--hc',h.color);
    el.innerHTML=
      '<div class="crest-head">'+
        '<div class="crest-wrap"><img src="'+h.img+'" alt="'+h.name+'"></div>'+
        '<div class="house-name" style="color:'+h.color+'">'+h.name+'</div>'+
        '<div class="counter" id="cnt-'+h.id+'"></div>'+
      '</div>'+
      '<div class="panel">'+
        '<textarea id="ta-'+h.id+'" placeholder="Escribe o pega aquí los nombres&#10;Uno por línea"></textarea>'+
        '<div class="hint">Se guardan solos</div>'+
      '</div>';
    main.appendChild(el);
    const ta=document.getElementById('ta-'+h.id);
    ta.value=d.text;
    ta.addEventListener('input',function(){
      const dd=data[h.id];
      dd.text=ta.value;
      dd.pool=parse(ta.value);
      dd.used=dd.used.filter(function(n){return dd.pool.indexOf(n)!==-1;});
      counter(h.id);
      save();
    });
    counter(h.id);
  });
}
function counter(id){
  const d=data[id];
  const el=document.getElementById('cnt-'+id);
  if(!el) return;
  const left=d.pool.length-d.used.length;
  el.innerHTML='<b>'+left+'</b> PENDIENTES · RONDA '+d.round+' · <b>'+d.pool.length+'</b> TOTAL';
}
function drawFrom(id){
  const d=data[id];
  if(!d.pool.length) return null;
  let pending=d.pool.filter(function(n){return d.used.indexOf(n)===-1;});
  if(!pending.length){
    d.used=[];
    d.round=d.round+1;
    pending=d.pool.slice();
  }
  const name=pending[Math.floor(Math.random()*pending.length)];
  d.used.push(name);
  return name;
}
function showCards(names){
  const grid=document.getElementById('ovGrid');
  grid.innerHTML='';
  HOUSES.forEach(function(h){
    const card=document.createElement('div');
    card.className='ov-card';
    card.style.setProperty('--hc',h.color);
    card.style.setProperty('--hg',h.glow);
    if(names[h.id]){
      card.innerHTML='<img class="ov-crest" src="'+h.img+'" alt="'+h.name+'">'+
        '<div class="ov-name">'+esc(names[h.id])+'</div>'+
        '<div class="ov-house">'+h.name+'</div>';
    }else{
      card.innerHTML='<img class="ov-crest" src="'+h.img+'" alt="'+h.name+'" style="opacity:.28;filter:grayscale(1)">'+
        '<div class="ov-none">SIN NOMBRES</div>'+
        '<div class="ov-house">'+h.name+'</div>';
    }
    grid.appendChild(card);
  });
  document.getElementById('overlay').classList.add('active');
}
function doRound(){
  const names={};
  let total=0;
  HOUSES.forEach(function(h){
    const n=drawFrom(h.id);
    names[h.id]=n;
    if(n) total++;
  });
  if(!total){ alert('Escribe al menos un nombre en alguna casa.'); return; }
  save();
  HOUSES.forEach(function(h){counter(h.id);});
  showCards(names);
  document.getElementById('ovRound').textContent=
    'RONDAS: '+HOUSES.map(function(h){return h.name.split('')[0]+data[h.id].round;}).join('  ');
}
document.getElementById('btnRound').addEventListener('click',doRound);
document.getElementById('btnAgain').addEventListener('click',doRound);
document.getElementById('btnClose').addEventListener('click',function(){
  document.getElementById('overlay').classList.remove('active');
});
document.getElementById('overlay').addEventListener('click',function(e){
  if(e.target.id==='overlay') this.classList.remove('active');
});
document.getElementById('btnReset').addEventListener('click',function(){
  if(!confirm('¿Borrar todas las listas de las 4 casas?')) return;
  HOUSES.forEach(function(h){ data[h.id]={text:'',pool:[],used:[],round:1}; });
  save();
  build();
});
build();

  ['neb1','neb2','neb3'].forEach(function(c){

    s.style.animationDuration=(1.6+Math.random()*3.4)+'s';

    sky.appendChild(s);
  }
  ['','s2','s3','s4'].forEach(function(c){
    const sh=document.createElement('div'); sh.className='shoot'+(c?' '+c:''); sky.appendChild(sh);
  });
  for(let i=0;i<16;i++){
    const p=document.createElement('div'); p.className='sparkbg';
    const sz=4+Math.random()*7;
